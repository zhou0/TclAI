# TclAI Workflow Refactor Ui And Logic Separation

## Action

Follow the refactor-ui-and-logic-separation workflow:
1. Extract core logic (e.g., JSON handling, networking) from UI file into a new or existing logic file (lib/llm_ui/llm_logic.tcl).
2. Update UI file (lib/llm_ui/llm_ui.tcl) to use the logic module, replacing direct logic with calls to the new namespace.
3. Update application entry point (llm_app.tcl) to use new namespace references if needed.
4. Update or add tests to cover the refactored logic and UI.
5. Update localization files if new UI elements or error messages are introduced.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: lib/llm_ui/llm_logic.tcl, lib/llm_ui/llm_ui.tcl, llm_app.tcl

