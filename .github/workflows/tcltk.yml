name: Tcl CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tcl (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y tcl tcl-dev tk-dev

      - name: Install Tcl (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install tcl-tk
          echo "/opt/homebrew/opt/tcl-tk/bin" >> $GITHUB_PATH

      - name: Install Tcl (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install magicsplat-tcl-tk

      - name: Environment Info
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            TCLSH=/opt/homebrew/opt/tcl-tk/bin/tclsh
          else
            TCLSH=tclsh
          fi
          $TCLSH << 'EOF'
          puts "Tcl Version: [info patchlevel]"
          if {[catch {package require TclOO} res]} {
              puts "TclOO: NOT FOUND ($res)"
          } else {
              puts "TclOO: Found [package present TclOO]"
          }
          EOF

      - name: Run Tcltests
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            TCLSH=/opt/homebrew/opt/tcl-tk/bin/tclsh
          else
            TCLSH=tclsh
          fi
          $TCLSH tests/test_navrail.tcl
          $TCLSH tests/test_llm_ui.tcl
