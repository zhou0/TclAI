name: Tcl CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 法律文档自动化项目（如 Casely）建议涵盖这三个平台
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 环境准备 ---
      - name: Install Tcl (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y tcl tcl-dev tk-dev

      - name: Install Tcl (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install tcl-tk@8

      - name: Install Tcl (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install magicsplat-tcl-tk

      # --- 运行单元测试 ---
      - name: Run Tcltests
        run: |
          # 假设你的测试脚本名为 all.tcl
          tclsh tests/test_navrail.tcl
          tclsh tests/test_llm_ui.tcl
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
